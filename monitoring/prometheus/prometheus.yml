global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: mock-enterprise
    static_configs:
      - targets: ["mock-enterprise:8000"]

  - job_name: voice
    static_configs:
      - targets: ["voice:8100"]

  - job_name: backend
    static_configs:
      - targets: ["backend:8200"]

  - job_name: rag
    static_configs:
      - targets: ["rag:8300"]

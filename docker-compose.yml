services:
  mock-enterprise:
    build:
      context: ./mock-enterprise
    container_name: finvoice-mock-enterprise
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

# Faz 2+ ile birlikte eklenecek servisler (bkz. ROADMAP.md):
#   backend         -> LangGraph agent orchestrator (Faz 4)
#   frontend        -> Next.js voice UI (Faz 2)
#   postgres, redis -> kalıcı state (Faz 4+)
#   ollama          -> lokal LLM (Faz 4)
#   prometheus, grafana -> observability (Faz 8)

services:
  mock-enterprise:
    build:
      context: ./mock-enterprise
    container_name: finvoice-mock-enterprise
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: finvoice-frontend
    environment:
      MOCK_ENTERPRISE_URL: http://mock-enterprise:8000
    ports:
      - "3000:3000"
    depends_on:
      - mock-enterprise

  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
    container_name: finvoice-voice
    environment:
      FINVOICE_VOICE_STT_BACKEND: faster-whisper
      FINVOICE_VOICE_WHISPER_MODEL: tiny
      # Bir Piper ses modeli indirip aşağıdaki volume'a koyana kadar "fake"
      # (sessiz WAV) kalır — bkz. voice/tts/models/README.md. Gerçek TTS
      # için: FINVOICE_VOICE_TTS_BACKEND=piper yapın ve modeli
      # ./voice/tts/models/'e indirin.
      FINVOICE_VOICE_TTS_BACKEND: fake
    ports:
      - "8100:8100"
    volumes:
      # faster-whisper'ın Hugging Face Hub'dan indirdiği modeli önbellekte
      # tutar, her container yeniden başlatıldığında yeniden indirmez.
      - voice-model-cache:/root/.cache/huggingface
      - ./voice/tts/models:/app/voice/tts/models

  ollama:
    image: ollama/ollama:latest
    container_name: finvoice-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    # İlk çalıştırmada modeli çekmeniz gerekir:
    #   docker compose exec ollama ollama pull qwen2.5:7b

  rag:
    build:
      context: .
      dockerfile: rag/Dockerfile
    container_name: finvoice-rag
    ports:
      - "8300:8300"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: finvoice-backend
    environment:
      MOCK_ENTERPRISE_URL: http://mock-enterprise:8000
      RAG_SERVICE_URL: http://rag:8300
      FINVOICE_AGENT_OLLAMA_HOST: http://ollama:11434
      FINVOICE_AGENT_AGENT_MODEL: qwen2.5:7b
    ports:
      - "8200:8200"
    depends_on:
      - mock-enterprise
      - rag
      - ollama

volumes:
  voice-model-cache:
  ollama-models:

# Faz 7+ ile birlikte eklenecek servisler (bkz. ROADMAP.md):
#   postgres, redis -> kalıcı state
#   prometheus, grafana -> observability (Faz 8)

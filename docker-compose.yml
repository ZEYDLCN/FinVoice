services:
  mock-enterprise:
    build:
      context: ./mock-enterprise
    container_name: finvoice-mock-enterprise
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
    container_name: finvoice-frontend
    environment:
      MOCK_ENTERPRISE_URL: http://mock-enterprise:8000
    ports:
      - "3000:3000"
    depends_on:
      - mock-enterprise

  voice:
    build:
      context: .
      dockerfile: voice/Dockerfile
    container_name: finvoice-voice
    environment:
      FINVOICE_VOICE_STT_BACKEND: faster-whisper
      FINVOICE_VOICE_WHISPER_MODEL: tiny
    ports:
      - "8100:8100"
    volumes:
      # faster-whisper'ın Hugging Face Hub'dan indirdiği modeli önbellekte
      # tutar, her container yeniden başlatıldığında yeniden indirmez.
      - voice-model-cache:/root/.cache/huggingface

volumes:
  voice-model-cache:

# Faz 4+ ile birlikte eklenecek servisler (bkz. ROADMAP.md):
#   backend         -> LangGraph agent orchestrator (Faz 4)
#   postgres, redis -> kalıcı state (Faz 4+)
#   ollama          -> lokal LLM (Faz 4)
#   prometheus, grafana -> observability (Faz 8)
